server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Real SPA fallback: any path that isn't a real static file falls
    # through to index.html, letting React Router handle client-side
    # routing (e.g. a hard refresh on /student/portfolio would 404
    # without this).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Real caching for Vite's real content-hashed asset filenames
    # (index-<hash>.js) - safe to cache aggressively since the
    # filename itself changes whenever the content does.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
